[workspace]
members = ["crates/protocol", "crates/core", "crates/usb-smoke", "spike/rust"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
rusb = { version = "0.9.4", features = ["vendored"] }
