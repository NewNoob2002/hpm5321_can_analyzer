name: Host Rust

on:
  push:
    paths:
      - "host/**"
      - ".github/workflows/host-rust.yml"
  pull_request:
    paths:
      - "host/**"
      - ".github/workflows/host-rust.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - name: Format
        run: cargo +1.97.1 fmt --manifest-path host/Cargo.toml --all --check
      - name: Build
        run: cargo +1.97.1 build --manifest-path host/Cargo.toml --workspace --release --locked
      - name: Test
        run: cargo +1.97.1 test --manifest-path host/Cargo.toml --workspace --release --locked
      - name: Clippy
        run: cargo +1.97.1 clippy --manifest-path host/Cargo.toml --workspace --all-targets --release --locked -- -D warnings
